version: '3'

services:
  db:
    image: postgres:alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: cortisol
    ports:
      - "5432:5432"
    command: postgres -c shared_buffers=16MB -c work_mem=1MB
    networks:
      - database

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass your_secure_password
    networks:
      - database

volumes:
  redis_data:

networks:
  database:
    driver: bridge
